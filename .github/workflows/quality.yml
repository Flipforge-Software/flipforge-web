name: Validate Devboard Utility

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync firmware assets and run tests
        run: npm run test:ci
      - name: Lint
        run: npm run lint
      - name: Build application from verified assets
        run: npm run build:app
